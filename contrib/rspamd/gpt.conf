# /etc/rspamd/local.d/gpt.conf: rspamd's gpt module through the relay
type = "openai";
url = "http://127.0.0.1:11338/v1/chat/completions";
# The relay's RELAY_TOKEN (not the Anthropic key)
api_key = "change-me";
# Sent along, but the relay always uses its own RELAY_MODEL
model = "claude-haiku-5-5";
model_parameters = {
  "claude-haiku-5-5" = {
    # Also sizes the message text rspamd sends; the relay caps the reply
    max_tokens = 1000,
  },
};
# The module defaults to 10s, above rspamd's task_timeout (8s by default);
# raise task_timeout if rspamd warns about it. The relay's RELAY_TIMEOUT
# should be a little shorter
timeout = 5s;
# Don't train bayes on the model's verdicts
autolearn = false;
# If you enable the sender-history context, send it as a user message so
# the relay wraps it with the mail as untrusted text (README.md)
#context = { enabled = true, as_system = false };
# No temperature, and no response_format: Anthropic's API rejects both
# for current models, and the relay drops them anyway
enabled = true;
